<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento | RSI Enterprise</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a237e 0%, #0d1452 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .maintenance-card {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }

        .logo {
            width: 180px;
            margin-bottom: 30px;
        }

        .maintenance-icon {
            font-size: 4rem;
            color: #1a237e;
            margin-bottom: 25px;
        }

        h1 {
            color: #1a237e;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .message {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .back-btn {
            background: #1a237e;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn:hover {
            background: #0d1452;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .maintenance-card {
                padding: 40px 25px;
            }
            
            .logo {
                width: 140px;
            }
            
            h1 {
                font-size: 1.7rem;
            }
            
            .message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-card">
        <img src="../../../vista/css/img/Logo-RSI-OFICIAL.png" alt="RSI Enterprise" class="logo">
        
        <div class="maintenance-icon">
            <i class="fas fa-tools"></i>
        </div>
        
        <h1>En Mantenimiento</h1>
        
        <p class="message">
            Esta sección se encuentra temporalmente en mantenimiento. 
            Estamos trabajando para mejorar tu experiencia.
        </p>
        
        <button class="back-btn" onclick="goBack()">
            <i class="fas fa-arrow-left"></i>
            Volver Atrás
        </button>
    </div>

    <script>
        function goBack() {
            if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
                window.history.back();
            } else {
                window.location.href = '../../../index.html';
            }
        }
    </script>
</body>
</html>
