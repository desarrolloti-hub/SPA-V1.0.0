<!-- ========================================
   DASHBOARD PARTNER - RSI Enterprise
   ======================================== -->

<section class="rsi-dashboard-section">
    <div class="rsi-container">
        
        <!-- Título -->
        <h1 class="rsi-page-title">
            <span class="rsi-text-gold">Dashboard</span> de Colaborador
        </h1>
        <p class="rsi-page-subtitle">
            Resumen de tu actividad y rendimiento en el sistema.
        </p>

        <!-- ===== PERFIL Y ASISTENCIA (MÁS PEQUEÑO) ===== -->
        <div class="rsi-dashboard-profile">
            <div class="rsi-profile-card">
                <div class="rsi-profile-avatar">
                    <img src="/assets/images/default-avatar.png" alt="Avatar" id="dashboardAvatar">
                    <span class="rsi-profile-status" id="profileStatus">
                        <i class="fas fa-circle"></i> Activo
                    </span>
                </div>
                <div class="rsi-profile-info">
                    <h2 id="dashboardName">Colaborador</h2>
                    <p id="dashboardRole"><i class="fas fa-briefcase"></i> Área</p>
                    <p id="dashboardEmail"><i class="fas fa-envelope"></i> correo@empresa.com</p>
                </div>
                <div class="rsi-profile-attendance">
                    <div class="rsi-attendance-card">
                        <div class="rsi-attendance-header">
                            <i class="fas fa-clipboard-check"></i>
                            <span>Asistencia Hoy</span>
                        </div>
                        <div class="rsi-attendance-status" id="attendanceStatus">
                            <span class="rsi-badge rsi-badge-warning">
                                <i class="fas fa-clock"></i> Pendiente
                            </span>
                        </div>
                        <button id="registerAttendanceBtn" class="rsi-btn-attendance">
                            <i class="fas fa-fingerprint"></i> Registrar Asistencia
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== GRÁFICAS (3 EN LA MISMA FILA) ===== -->
        <div class="rsi-dashboard-charts">
            <div class="rsi-chart-row">
                <div class="rsi-chart-card">
                    <h4><i class="fas fa-chart-pie"></i> Distribución</h4>
                    <div class="rsi-chart-container">
                        <canvas id="ticketsPieChart"></canvas>
                    </div>
                </div>
                <div class="rsi-chart-card">
                    <h4><i class="fas fa-chart-bar"></i> Tickets por Mes</h4>
                    <div class="rsi-chart-container">
                        <canvas id="ticketsBarChart"></canvas>
                    </div>
                </div>
                <div class="rsi-chart-card">
                    <h4><i class="fas fa-chart-line"></i> Rendimiento</h4>
                    <div class="rsi-chart-container">
                        <canvas id="performanceLineChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== ESTADÍSTICAS ===== -->
        <div class="rsi-dashboard-stats">
            <div class="rsi-stats-grid">
                <div class="rsi-stat-card rsi-stat-total">
                    <div class="rsi-stat-icon">
                        <i class="fas fa-ticket-alt"></i>
                    </div>
                    <div class="rsi-stat-content">
                        <span class="rsi-stat-number" id="totalTickets">0</span>
                        <span class="rsi-stat-label">Total Tickets</span>
                    </div>
                </div>
                <div class="rsi-stat-card rsi-stat-pending">
                    <div class="rsi-stat-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="rsi-stat-content">
                        <span class="rsi-stat-number" id="pendingTickets">0</span>
                        <span class="rsi-stat-label">Pendientes</span>
                    </div>
                </div>
                <div class="rsi-stat-card rsi-stat-in-progress">
                    <div class="rsi-stat-icon">
                        <i class="fas fa-spinner"></i>
                    </div>
                    <div class="rsi-stat-content">
                        <span class="rsi-stat-number" id="inProgressTickets">0</span>
                        <span class="rsi-stat-label">En Progreso</span>
                    </div>
                </div>
                <div class="rsi-stat-card rsi-stat-completed">
                    <div class="rsi-stat-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="rsi-stat-content">
                        <span class="rsi-stat-number" id="completedTickets">0</span>
                        <span class="rsi-stat-label">Completados</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== TICKETS (TARJETAS MÁS GRANDES) ===== -->
        <div class="rsi-dashboard-tickets">
            <div class="rsi-tickets-header">
                <h3><i class="fas fa-ticket-alt"></i> Mis Tickets</h3>
            </div>
            <div class="rsi-tickets-grid" id="recentTickets">
                <!-- Se llena dinámicamente -->
                <div class="rsi-tickets-empty">
                    <i class="fas fa-ticket-alt"></i>
                    <p>No hay tickets</p>
                </div>
            </div>
        </div>

    </div>
</section>

<!-- ========================================
   ESTILOS CSS - DASHBOARD
   ======================================== -->
<style>
    /* ==========================================
       SECCIÓN PRINCIPAL
    ========================================== */
    .rsi-dashboard-section {
        padding: var(--rsi-spacing-2xl) 0;
    }

    /* ==========================================
       PERFIL Y ASISTENCIA (MÁS PEQUEÑO)
    ========================================== */
    .rsi-dashboard-profile {
        margin-bottom: var(--rsi-spacing-xl);
    }

    .rsi-profile-card {
        display: flex;
        align-items: center;
        gap: var(--rsi-spacing-lg);
        padding: var(--rsi-spacing-lg);
        background: var(--rsi-bg-card);
        border-radius: var(--rsi-radius-xl);
        border: 1px solid var(--rsi-gray-200);
        box-shadow: var(--rsi-shadow-sm);
        flex-wrap: wrap;
    }

    .rsi-profile-avatar {
        position: relative;
        flex-shrink: 0;
    }

    .rsi-profile-avatar img {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--rsi-primary);
        box-shadow: var(--rsi-shadow-sm);
    }

    .rsi-profile-status {
        position: absolute;
        bottom: 2px;
        right: 2px;
        font-size: 0.6rem;
        background: var(--rsi-bg-card);
        padding: 1px 8px;
        border-radius: 20px;
        border: 1px solid var(--rsi-gray-200);
        color: var(--rsi-success);
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: var(--rsi-spacing-xs);
        white-space: nowrap;
    }

    .rsi-profile-status i {
        font-size: 0.4rem;
        color: var(--rsi-success);
    }

    .rsi-profile-info {
        flex: 1;
        min-width: 150px;
    }

    .rsi-profile-info h2 {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--rsi-text-primary);
        margin: 0;
    }

    .rsi-profile-info p {
        color: var(--rsi-gray-600);
        margin: 2px 0;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: var(--rsi-spacing-sm);
    }

    .rsi-profile-info p i {
        width: 16px;
        font-size: 0.8rem;
        color: var(--rsi-primary);
    }

    .rsi-profile-attendance {
        flex-shrink: 0;
        min-width: 180px;
    }

    .rsi-attendance-card {
        background: var(--rsi-gray-50);
        border-radius: var(--rsi-radius-lg);
        padding: var(--rsi-spacing-md) var(--rsi-spacing-lg);
        border: 1px solid var(--rsi-gray-200);
        min-width: 180px;
    }

    .rsi-attendance-header {
        display: flex;
        align-items: center;
        gap: var(--rsi-spacing-sm);
        font-weight: 600;
        color: var(--rsi-text-primary);
        margin-bottom: var(--rsi-spacing-xs);
        font-size: 0.85rem;
    }

    .rsi-attendance-header i {
        color: var(--rsi-primary);
    }

    .rsi-attendance-status {
        margin: var(--rsi-spacing-xs) 0 var(--rsi-spacing-sm);
    }

    .rsi-btn-attendance {
        width: 100%;
        padding: 8px 16px;
        background: var(--rsi-primary);
        color: var(--rsi-white);
        border: none;
        border-radius: var(--rsi-radius-md);
        font-weight: 600;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all var(--rsi-transition-base);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--rsi-spacing-sm);
    }

    .rsi-btn-attendance:hover {
        background: var(--rsi-primary-dark);
        transform: translateY(-2px);
        box-shadow: var(--rsi-shadow-primary);
    }

    .rsi-btn-attendance:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    /* ==========================================
       GRÁFICAS (3 EN UNA FILA)
    ========================================== */
    .rsi-dashboard-charts {
        margin-bottom: var(--rsi-spacing-xl);
    }

    .rsi-chart-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--rsi-spacing-md);
    }

    .rsi-chart-card {
        background: var(--rsi-bg-card);
        border-radius: var(--rsi-radius-lg);
        padding: var(--rsi-spacing-md);
        border: 1px solid var(--rsi-gray-200);
        box-shadow: var(--rsi-shadow-sm);
    }

    .rsi-chart-card h4 {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--rsi-text-primary);
        margin: 0 0 var(--rsi-spacing-sm) 0;
        display: flex;
        align-items: center;
        gap: var(--rsi-spacing-sm);
    }

    .rsi-chart-card h4 i {
        color: var(--rsi-primary);
        font-size: 0.9rem;
    }

    .rsi-chart-container {
        position: relative;
        height: 160px;
        width: 100%;
    }

    /* ==========================================
       ESTADÍSTICAS
    ========================================== */
    .rsi-dashboard-stats {
        margin-bottom: var(--rsi-spacing-xl);
    }

    .rsi-stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: var(--rsi-spacing-md);
    }

    .rsi-stat-card {
        display: flex;
        align-items: center;
        gap: var(--rsi-spacing-md);
        padding: var(--rsi-spacing-md) var(--rsi-spacing-lg);
        background: var(--rsi-bg-card);
        border-radius: var(--rsi-radius-lg);
        border: 1px solid var(--rsi-gray-200);
        box-shadow: var(--rsi-shadow-sm);
        transition: all var(--rsi-transition-base);
    }

    .rsi-stat-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--rsi-shadow-md);
    }

    .rsi-stat-icon {
        width: 42px;
        height: 42px;
        border-radius: var(--rsi-radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        flex-shrink: 0;
    }

    .rsi-stat-total .rsi-stat-icon {
        background: rgba(28, 25, 72, 0.1);
        color: var(--rsi-primary);
    }

    .rsi-stat-pending .rsi-stat-icon {
        background: rgba(255, 193, 7, 0.1);
        color: var(--rsi-warning);
    }

    .rsi-stat-in-progress .rsi-stat-icon {
        background: rgba(23, 162, 184, 0.1);
        color: var(--rsi-info);
    }

    .rsi-stat-completed .rsi-stat-icon {
        background: rgba(40, 167, 69, 0.1);
        color: var(--rsi-success);
    }

    .rsi-stat-content {
        flex: 1;
    }

    .rsi-stat-number {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--rsi-text-primary);
        display: block;
        line-height: 1.2;
    }

    .rsi-stat-label {
        font-size: 0.8rem;
        color: var(--rsi-gray-500);
    }

    /* ==========================================
       TICKETS (TARJETAS MÁS GRANDES)
    ========================================== */
    .rsi-dashboard-tickets {
        margin-top: var(--rsi-spacing-xl);
    }

    .rsi-tickets-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--rsi-spacing-lg);
        flex-wrap: wrap;
        gap: var(--rsi-spacing-sm);
    }

    .rsi-tickets-header h3 {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--rsi-text-primary);
        margin: 0;
        display: flex;
        align-items: center;
        gap: var(--rsi-spacing-sm);
    }

    .rsi-tickets-header h3 i {
        color: var(--rsi-primary);
    }

    .rsi-tickets-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: var(--rsi-spacing-lg);
    }

    .rsi-ticket-card {
        background: var(--rsi-bg-card);
        border-radius: var(--rsi-radius-lg);
        padding: var(--rsi-spacing-lg);
        border: 1px solid var(--rsi-gray-200);
        box-shadow: var(--rsi-shadow-sm);
        transition: all var(--rsi-transition-base);
        position: relative;
        overflow: hidden;
    }

    .rsi-ticket-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
    }

    .rsi-ticket-card.status-pending::before {
        background: var(--rsi-warning);
    }

    .rsi-ticket-card.status-in-progress::before {
        background: var(--rsi-info);
    }

    .rsi-ticket-card.status-completed::before {
        background: var(--rsi-success);
    }

    .rsi-ticket-card.status-closed::before {
        background: var(--rsi-gray-400);
    }

    .rsi-ticket-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--rsi-shadow-md);
    }

    .rsi-ticket-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: var(--rsi-spacing-sm);
    }

    .rsi-ticket-title {
        font-weight: 600;
        color: var(--rsi-text-primary);
        font-size: 1rem;
        margin: 0;
        flex: 1;
        margin-right: var(--rsi-spacing-sm);
    }

    .rsi-ticket-id {
        font-size: 0.7rem;
        color: var(--rsi-gray-500);
        font-family: monospace;
        background: var(--rsi-gray-100);
        padding: 2px 8px;
        border-radius: var(--rsi-radius-sm);
        flex-shrink: 0;
    }

    .rsi-ticket-meta {
        display: flex;
        gap: var(--rsi-spacing-md);
        margin-bottom: var(--rsi-spacing-sm);
        flex-wrap: wrap;
        font-size: 0.8rem;
        color: var(--rsi-gray-500);
    }

    .rsi-ticket-meta span {
        display: flex;
        align-items: center;
        gap: var(--rsi-spacing-xs);
    }

    .rsi-ticket-meta i {
        font-size: 0.7rem;
    }

    .rsi-ticket-description {
        color: var(--rsi-gray-600);
        font-size: 0.9rem;
        margin: var(--rsi-spacing-sm) 0;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 42px;
    }

    .rsi-ticket-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: var(--rsi-spacing-md);
        padding-top: var(--rsi-spacing-sm);
        border-top: 1px solid var(--rsi-gray-100);
        flex-wrap: wrap;
        gap: var(--rsi-spacing-sm);
    }

    .rsi-ticket-priority {
        font-size: 0.7rem;
        font-weight: 600;
        padding: 2px 10px;
        border-radius: 20px;
    }

    .rsi-ticket-priority.priority-low {
        background: rgba(40, 167, 69, 0.1);
        color: var(--rsi-success);
    }

    .rsi-ticket-priority.priority-medium {
        background: rgba(255, 193, 7, 0.1);
        color: var(--rsi-warning);
    }

    .rsi-ticket-priority.priority-high {
        background: rgba(220, 53, 69, 0.1);
        color: var(--rsi-danger);
    }

    .rsi-ticket-priority.priority-urgent {
        background: rgba(220, 53, 69, 0.2);
        color: var(--rsi-danger);
        animation: pulsePriority 1.5s ease-in-out infinite;
    }

    @keyframes pulsePriority {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
    }

    .rsi-btn-ticket-detail {
        padding: 6px 16px;
        background: transparent;
        color: var(--rsi-primary);
        border: 2px solid var(--rsi-primary);
        border-radius: var(--rsi-radius-sm);
        font-weight: 600;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all var(--rsi-transition-base);
        display: flex;
        align-items: center;
        gap: var(--rsi-spacing-sm);
    }

    .rsi-btn-ticket-detail:hover {
        background: var(--rsi-primary);
        color: var(--rsi-white);
    }

    .rsi-tickets-empty {
        grid-column: 1 / -1;
        text-align: center;
        padding: var(--rsi-spacing-2xl);
        color: var(--rsi-gray-500);
    }

    .rsi-tickets-empty i {
        font-size: 2.5rem;
        color: var(--rsi-gray-300);
        display: block;
        margin-bottom: var(--rsi-spacing-md);
    }

    .rsi-tickets-empty p {
        font-size: 0.95rem;
        margin: 0;
    }

    /* ==========================================
       RESPONSIVE
    ========================================== */
    @media (max-width: 1200px) {
        .rsi-chart-row {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    @media (max-width: 992px) {
        .rsi-chart-row {
            grid-template-columns: repeat(2, 1fr);
        }

        .rsi-stats-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .rsi-profile-card {
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .rsi-profile-info {
            text-align: center;
        }

        .rsi-profile-info p {
            justify-content: center;
        }

        .rsi-profile-attendance {
            width: 100%;
            max-width: 250px;
        }
    }

    @media (max-width: 768px) {
        .rsi-chart-row {
            grid-template-columns: 1fr;
        }

        .rsi-tickets-grid {
            grid-template-columns: 1fr;
        }

        .rsi-chart-container {
            height: 180px;
        }
    }

    @media (max-width: 576px) {
        .rsi-stats-grid {
            grid-template-columns: 1fr;
        }

        .rsi-ticket-header {
            flex-direction: column;
            gap: var(--rsi-spacing-xs);
        }

        .rsi-profile-avatar img {
            width: 60px;
            height: 60px;
        }

        .rsi-profile-status {
            font-size: 0.5rem;
            padding: 1px 6px;
        }

        .rsi-stat-card {
            padding: var(--rsi-spacing-sm) var(--rsi-spacing-md);
        }

        .rsi-stat-number {
            font-size: 1.2rem;
        }

        .rsi-chart-container {
            height: 150px;
        }

        .rsi-ticket-description {
            -webkit-line-clamp: 2;
            min-height: 36px;
        }

        .rsi-attendance-card {
            min-width: auto;
        }

        .rsi-profile-attendance {
            max-width: 100%;
        }
    }

    /* ==========================================
       MODO OSCURO
    ========================================== */
    body.dark-mode .rsi-profile-card {
        background: var(--rsi-bg-card);
        border-color: var(--rsi-gray-300);
    }

    body.dark-mode .rsi-profile-info h2 {
        color: var(--rsi-text-light);
    }

    body.dark-mode .rsi-attendance-card {
        background: var(--rsi-gray-800);
        border-color: var(--rsi-gray-300);
    }

    body.dark-mode .rsi-attendance-header {
        color: var(--rsi-text-light);
    }

    body.dark-mode .rsi-stat-card {
        background: var(--rsi-bg-card);
        border-color: var(--rsi-gray-300);
    }

    body.dark-mode .rsi-stat-number {
        color: var(--rsi-text-light);
    }

    body.dark-mode .rsi-chart-card {
        background: var(--rsi-bg-card);
        border-color: var(--rsi-gray-300);
    }

    body.dark-mode .rsi-chart-card h4 {
        color: var(--rsi-text-light);
    }

    body.dark-mode .rsi-ticket-card {
        background: var(--rsi-bg-card);
        border-color: var(--rsi-gray-300);
    }

    body.dark-mode .rsi-ticket-title {
        color: var(--rsi-text-light);
    }

    body.dark-mode .rsi-ticket-description {
        color: var(--rsi-gray-400);
    }

    body.dark-mode .rsi-ticket-id {
        background: var(--rsi-gray-700);
        color: var(--rsi-gray-400);
    }

    body.dark-mode .rsi-tickets-header h3 {
        color: var(--rsi-text-light);
    }

    body.dark-mode .rsi-profile-status {
        background: var(--rsi-gray-800);
        border-color: var(--rsi-gray-300);
    }

    body.dark-mode .rsi-btn-ticket-detail {
        border-color: var(--rsi-primary);
        color: var(--rsi-primary);
    }

    body.dark-mode .rsi-btn-ticket-detail:hover {
        background: var(--rsi-primary);
        color: var(--rsi-white);
    }

    body.dark-mode .rsi-profile-info p {
        color: var(--rsi-gray-400);
    }
</style>
