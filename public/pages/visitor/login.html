<!-- ========================================
   LOGIN - RSI Enterprise
   ======================================== -->
<section class="rsi-login-section">
    <div class="rsi-container">
        <!-- Formulario de Login -->
        <div class="rsi-form-card rsi-login-card">
            <div class="rsi-form-header">
                <div class="rsi-form-icon">
                    <i class="fas fa-user"></i>
                </div>
                <h2>Iniciar Sesión</h2>
                <p>Accede a tu cuenta para continuar</p>
            </div>

            <form id="loginForm" autocomplete="off">
                <!-- Email -->
                <div class="rsi-form-group">
                    <label for="email">Correo electrónico <span class="rsi-required">*</span></label>
                    <div class="rsi-input-wrapper">
                        <i class="fas fa-envelope rsi-input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="nombre@rsienterprise.com" required autofocus>
                    </div>
                    <span class="rsi-form-error-message">Por favor ingresa un correo válido</span>
                </div>

                <!-- Contraseña -->
                <div class="rsi-form-group">
                    <label for="password">Contraseña <span class="rsi-required">*</span></label>
                    <div class="rsi-input-wrapper">
                        <i class="fas fa-lock rsi-input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required minlength="6">
                        <button type="button" class="rsi-password-toggle" id="togglePassword" aria-label="Mostrar contraseña">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="rsi-form-error-message">La contraseña debe tener al menos 6 caracteres</span>
                </div>

                <!-- Opciones adicionales -->
                <div class="rsi-login-options">
                    <div class="rsi-checkbox-group">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <label for="rememberMe">Recordarme</label>
                    </div>
                    <a href="#" class="rsi-forgot-password" id="forgotPassword">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Botón de envío -->
                <button type="submit" class="rsi-btn-submit" id="loginSubmit">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>

                <!-- Separador -->
                <div style="margin: 16px 0; display: flex; align-items: center; gap: 10px; color: var(--rsi-gray-400);">
                    <hr style="flex: 1; border: none; border-top: 1px solid var(--rsi-border-color, #e2e8f0);" />
                    <span style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase;">O continúa con</span>
                    <hr style="flex: 1; border: none; border-top: 1px solid var(--rsi-border-color, #e2e8f0);" />
                </div>

                <!-- Botón Google -->
                <button type="button" class="rsi-btn-submit" id="btnGoogleLogin" style="background: var(--rsi-card-bg, #ffffff); color: var(--rsi-text-primary, #1e293b); border: 1px solid var(--rsi-border-color, #cbd5e1); display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,0.04); margin-bottom: 8px; cursor: pointer;">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width: 18px; height: 18px;" />
                    Continuar con Google
                </button>

                <!-- Link a registro -->
                <div class="rsi-login-footer">
                    <p>¿Eres nuevo cliente? <a href="/register" data-link style="font-weight: 700; color: var(--rsi-gold);">Crea tu cuenta aquí</a></p>
                </div>
            </form>
        </div>

    </div>
</section>
