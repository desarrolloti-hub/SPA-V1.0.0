<!-- ========================================
   REGISTER - RSI Enterprise
   Registro de Comprador / Cliente
   ======================================== -->
<section class="rsi-login-section">
    <div class="rsi-container">
        <!-- Formulario de Registro -->
        <div class="rsi-form-card rsi-login-card">
            <div class="rsi-form-header">
                <div class="rsi-form-icon" style="background: rgba(197, 160, 89, 0.15); color: var(--rsi-gold);">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2>Crear Cuenta de Cliente</h2>
                <p>Regístrate para guardar tu carrito, favoritos y facturación</p>
            </div>

            <form id="registerForm" autocomplete="off">
                <!-- Nombre Completo -->
                <div class="rsi-form-group">
                    <label for="regNombre">Nombre Completo <span class="rsi-required">*</span></label>
                    <div class="rsi-input-wrapper">
                        <i class="fas fa-user rsi-input-icon"></i>
                        <input type="text" id="regNombre" name="regNombre" placeholder="Tu nombre y apellido" required autofocus>
                    </div>
                </div>

                <!-- Email -->
                <div class="rsi-form-group">
                    <label for="regEmail">Correo electrónico <span class="rsi-required">*</span></label>
                    <div class="rsi-input-wrapper">
                        <i class="fas fa-envelope rsi-input-icon"></i>
                        <input type="email" id="regEmail" name="regEmail" placeholder="tucorreo@ejemplo.com" required>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="rsi-form-group">
                    <label for="regPassword">Contraseña <span class="rsi-required">*</span></label>
                    <div class="rsi-input-wrapper">
                        <i class="fas fa-lock rsi-input-icon"></i>
                        <input type="password" id="regPassword" name="regPassword" placeholder="Crea una contraseña segura (mín. 6 caracteres)" required minlength="6">
                    </div>
                </div>

                <!-- Botón de envío -->
                <button type="submit" class="rsi-btn-submit" id="btnRegisterSubmit" style="margin-top: 10px;">
                    <i class="fas fa-check-circle"></i> Registrarme como Cliente
                </button>

                <!-- Separador -->
                <div style="margin: 16px 0; display: flex; align-items: center; gap: 10px; color: var(--rsi-gray-400);">
                    <hr style="flex: 1; border: none; border-top: 1px solid var(--rsi-border-color, #e2e8f0);" />
                    <span style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase;">O regístrate con</span>
                    <hr style="flex: 1; border: none; border-top: 1px solid var(--rsi-border-color, #e2e8f0);" />
                </div>

                <!-- Botón Google -->
                <button type="button" class="rsi-btn-submit" id="btnGoogleRegister" style="background: var(--rsi-card-bg, #ffffff); color: var(--rsi-text-primary, #1e293b); border: 1px solid var(--rsi-border-color, #cbd5e1); display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,0.04); margin-bottom: 8px; cursor: pointer;">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width: 18px; height: 18px;" />
                    Registrarme con Google
                </button>

                <!-- Link a login -->
                <div class="rsi-login-footer">
                    <p>¿Ya tienes una cuenta? <a href="/login" data-link style="font-weight: 700; color: var(--rsi-gold);">Inicia sesión aquí</a></p>
                </div>
            </form>
        </div>

    </div>
</section>
