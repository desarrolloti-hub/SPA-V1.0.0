<!-- ========================================
   MODAL: Registro rápido de Cliente
   ======================================== -->
<div class="rsi-modal-backdrop">
    <div class="rsi-modal" role="dialog" aria-modal="true" aria-labelledby="clienteModalTitle" style="max-width: 580px;">

        <!-- Header -->
        <div class="rsi-modal-header">
            <h2 id="clienteModalTitle">
                <i class="fas fa-user-plus"></i>
                <span class="rsi-text-gold">Nuevo</span> Cliente
            </h2>
            <button type="button" class="rsi-modal-close" data-modal-close aria-label="Cerrar">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Body -->
        <form id="clienteModalForm" class="rsi-modal-body" autocomplete="off">

            <div class="rsi-form-row">
                <div class="rsi-form-group">
                    <label for="modalRazonSocial">Nombre / Razón Social <span class="rsi-required">*</span></label>
                    <div class="rsi-input-wrapper">
                        <i class="fas fa-building rsi-input-icon"></i>
                        <input type="text" id="modalRazonSocial" placeholder="Nombre o razón social" required>
                    </div>
                    <div class="rsi-form-error-message"></div>
                </div>

                <div class="rsi-form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                        <label for="modalRfc" style="margin-bottom: 0;">RFC <span class="rsi-required">*</span></label>
                        <div style="display: inline-flex; gap: 4px;">
                            <button type="button" id="modalBtnRfcPublico" class="rsi-btn-rfc-quick" style="background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; border-radius: 4px; padding: 1px 6px; font-size: 0.72rem; font-weight: 600; cursor: pointer;">Público Gen.</button>
                            <button type="button" id="modalBtnRfcExtranjero" class="rsi-btn-rfc-quick" style="background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; border-radius: 4px; padding: 1px 6px; font-size: 0.72rem; font-weight: 600; cursor: pointer;">Extranjero</button>
                        </div>
                    </div>
                    <div class="rsi-input-wrapper">
                        <i class="fas fa-id-card rsi-input-icon"></i>
                        <input type="text" id="modalRfc" placeholder="ABC123456789" required maxlength="13" style="text-transform: uppercase;">
                    </div>
                    <div class="rsi-form-error-message"></div>
                </div>
            </div>

            <div class="rsi-form-row">
                <div class="rsi-form-group">
                    <label for="modalRegimen">Régimen Fiscal (Opcional)</label>
                    <div class="rsi-input-wrapper">
                        <i class="fas fa-scale-balanced rsi-input-icon"></i>
                        <input type="text" id="modalRegimen" placeholder="Busca el régimen" list="modalRegimenesList">
                        <datalist id="modalRegimenesList"></datalist>
                    </div>
                    <div class="rsi-form-error-message"></div>
                </div>

                <div class="rsi-form-group">
                    <label for="modalCodigoPostal">Código Postal (Opcional)</label>
                    <div class="rsi-input-wrapper">
                        <i class="fas fa-envelope rsi-input-icon"></i>
                        <input type="text" id="modalCodigoPostal" placeholder="12345" maxlength="5">
                    </div>
                    <div class="rsi-form-error-message"></div>
                </div>
            </div>

            <div class="rsi-form-row">
                <div class="rsi-form-group">
                    <label for="modalEmail">Correo Electrónico (Opcional)</label>
                    <div class="rsi-input-wrapper">
                        <i class="fas fa-envelope rsi-input-icon"></i>
                        <input type="email" id="modalEmail" placeholder="cliente@empresa.com">
                    </div>
                    <div class="rsi-form-error-message"></div>
                </div>

                <div class="rsi-form-group">
                    <label for="modalTelefono">Teléfono Móvil (Opcional)</label>
                    <div class="rsi-input-wrapper">
                        <i class="fas fa-mobile-alt rsi-input-icon"></i>
                        <input type="tel" id="modalTelefono" placeholder="55 1234 5678">
                    </div>
                    <div class="rsi-form-error-message"></div>
                </div>
            </div>

            <p class="rsi-modal-hint">
                <i class="fas fa-info-circle"></i>
                Solo el Nombre y el RFC son obligatorios. Para capturar el domicilio fiscal completo, usa el
                <a href="/partner/crudClientes/nuevo">formulario completo</a>.
            </p>
        </form>

        <!-- Footer -->
        <div class="rsi-modal-footer">
            <button type="button" class="rsi-btn-prev" data-modal-close>
                Cancelar
            </button>
            <button type="button" class="rsi-btn-submit-step" id="modalSubmitCliente">
                <i class="fas fa-save"></i> Registrar Cliente
            </button>
        </div>

    </div>
</div>
